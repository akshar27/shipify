name: CI

# Runs on pull requests and on branches other than main. Pushes to main run it through deploy.yml (workflow_call),
# so a broken commit can never reach the server.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shipify
          POSTGRES_PASSWORD: shipify
          POSTGRES_DB: shipify_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shipify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://shipify:shipify@localhost:5432/shipify_test
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-1234
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test
      - name: Dependency audit (high and critical only)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false
        env:
          CI: "true"
      # CI=true makes the build fail on lint warnings, which keeps unused code out.
      - run: npm run build
        env:
          CI: "true"

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ShipifyMobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ShipifyMobile/package-lock.json
      - run: npm ci
      - run: npm test
      # No emulator in CI: bundling both platforms catches anything that would not compile on a phone.
      - run: npx expo export --platform ios --output-dir /tmp/ios
      - run: npx expo export --platform android --output-dir /tmp/android
